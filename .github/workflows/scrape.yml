name: Scrape G1 results
on:
  push:
    branches: [main]
    paths-ignore:
      - 'output/**'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: g1-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scrape every minute for five iterations
        shell: bash
        run: |
          mkdir -p output
          for i in 1 2 3 4 5; do
            echo "Scrape iteration $i of 5"
            python scraper.py || true
            python - <<'PY'
          import datetime, json
          from pathlib import Path
          status_file = Path("output/status.json")
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          try:
              status = json.loads(status_file.read_text(encoding="utf-8"))
          except Exception as exc:
              status = {"status": "error", "error": "Cannot read status: " + str(exc)}
          status["updated_at_utc"] = now
          status["run_url"] = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status_file.write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
          entry = {
              "timestamp_utc": now,
              "source_fetched_at_utc": status.get("fetched_at_utc"),
              "status": status.get("status", "error"),
              "countries": status.get("countries"),
              "error": status.get("error"),
              "run_url": status["run_url"],
          }
          with Path("output/execution_log.jsonl").open("a", encoding="utf-8") as log:
              log.write(json.dumps(entry, ensure_ascii=False) + "\n")
          print(json.dumps(entry, ensure_ascii=False))
          PY
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
      - name: Persist status, log and results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add -f output/status.json output/execution_log.jsonl
          for file in output/*.csv output/*.xlsx; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update scraper results and execution log [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-scrape-output
          path: output/
          if-no-files-found: warn
