name: Scrape G1 results
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-scrape-output
          path: output/
          if-no-files-found: warn
